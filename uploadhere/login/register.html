<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no">
  <link href="" rel="icon">
  <title>Register -MBD</title>
  <meta name="description" content="Login and Register Form Html Template">
  <meta name="author" content="harnishdesign.net">


  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:100,200,300,400,500,600,700,800,900"
    type="text/css">

  <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
  <link rel="stylesheet" type="text/css" href="css/all.min.css">
  <link rel="stylesheet" type="text/css" href="css/stylesheet.css">
  
  <link id="color-switcher" type="text/css" rel="stylesheet" href="#">
</head>

<body>


  <div class="preloader preloader-dark">
    <div class="lds-ellipsis">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>


  <div id="main-wrapper" class="oxyy-login-register bg-dark">
    <div class="container">
      <div class="row g-0 min-vh-100 py-4 py-md-5">

        <div class="col-lg-7 shadow-lg">
          <div class="hero-wrap d-flex align-items-center rounded-3 rounded-end-0 h-100">
            <div class="hero-mask opacity-9 bg-primary"></div>
            <div class="hero-bg hero-bg-scroll" style="background-image:url('images/login-bg.jpg');"></div>
            <div class="hero-content mx-auto w-100 h-100 d-flex flex-column">
              <div class="row g-0">
                <div class="col-11 col-lg-10 mx-auto">
                  <div class="logo mt-5 mb-5 mb-lg-0"> <a href="#" title="logo"><img
                        src="" alt="logo"></a> </div>
                </div>
              </div>
              <div class="row g-0 my-auto">
                <div class="col-11 col-lg-10 mx-auto">
                  <h1 class="text-11 text-white mb-3">You're new here!</h1>
                  <p class="text-5 text-white lh-base mb-4">Sign up with your email and personal details to get started!
                  </p>
                  
                </div>
              </div>
            </div>
          </div>
        </div>
       
        <div class="col-lg-5 shadow-lg d-flex align-items-center rounded-3 rounded-start-0 bg-dark">
          <div class="container my-auto py-5">
            <div class="row">
              <div class="col-11 col-lg-10 mx-auto">
                <h3 class="text-white text-center mb-4">Sign Up</h3>
                <form id="registerForm" class="form-dark" method="post">
                  <div class="mb-3">
                    <label class="form-label text-light" for="fullName">Full Name</label>
                    <input type="text" class="form-control" id="fullName" required="" placeholder="Enter Your Name">
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-light" for="fullName">Username</label>
                    <input type="text" class="form-control" id="fullName" required="" placeholder="Enter Your Username">
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-light" for="emailAddress">Email Address</label>
                    <input type="email" class="form-control" id="emailAddress" required=""
                      placeholder="Enter Your Email">
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-light" for="Phone Number">Phone Number</label>
                    <input type="number" class="form-control" id="Phone Number" required="" placeholder="Enter Your Phone Number">
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-light" for="loginPassword">Password</label>
                    <input type="password" class="form-control" id="loginPassword" required=""
                      placeholder="Enter Password">
                  </div>
                  <div class="mb-3">
                    <label class="form-label text-light" for="profile photo">Profile Photo</label>
                    <input type="file" class="form-control" id="profile photo" required=""
                    >
                  </div>
                  <div class="mb-3 mt-4">
                    <div class="form-check text-2">
                      <input id="agree" name="agree" class="form-check-input" type="checkbox">
                      <label class="form-check-label text-light" for="agree">I agree to the <a href="#">Terms</a> and <a
                          href="#">Privacy Policy</a>.</label>
                    </div>
                  </div>
                  <div class="d-grid my-4">
                    <button class="btn btn-primary" type="submit">Sign Up</button>
                  </div>
                </form>
                
                
                <p class="text-2 text-center text-light">Already have an account? <a href="login.html">Sign In</a></p>
              </div>
            </div>
          </div>
        </div>
        
      </div>
    </div>
  </div>
 

  <script src="js/jquery.min.js"></script>
  <script src="js/bootstrap.bundle.min.js"></script>
 
  <script src="js/switcher.min.js"></script>
  <script src="js/theme.js"></script>

</body>

</html>
